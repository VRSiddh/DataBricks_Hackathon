# Databricks App manifest — https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-manifest
# Platform injects PORT; app.py reads it when booting uvicorn.
command:
  - python
  - app.py

env:
  - name: NYAYA_VECTOR_ENDPOINT
    value: "nyaya-sahayak-vs"
  - name: NYAYA_VECTOR_INDEX
    value: "workspace.nyaya_sahayak.bns_chunks_index"
  - name: SARVAM_API_KEY
    # Value is injected during deployment or via Databricks App UI
    value: "your_sarvam_api_key_here"
  - name: NYAYA_LLM_ENDPOINT
    description: "Comma-separated Model Serving endpoint names. If unset, auto-detects foundation endpoints."

